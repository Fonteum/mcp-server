# Smithery manifest for the hosted Fonteum MCP server.
# The service is a remote Streamable HTTP server; Smithery connects to the
# existing endpoint and does not build or deploy this repository.

name: "fonteum/mcp-server"
displayName: "Fonteum — Public Records & Enforcement Integrity"
version: "1.0.0"
description: >-
  Hosted, read-only MCP access to source-linked public records from the United
  States and supported global open-data registers. Covers healthcare, federal
  procurement, sanctions and watchlists, federal enforcement, intellectual
  property, securities filings, and company registers. Results include the
  source context available for each record. Fonteum reports public-record facts,
  not clearances, risk scores, labels, or verdicts.
author:
  name: "Fonteum LLC"
  email: "hello@fonteum.com"
  url: "https://fonteum.com"
license: MIT
homepage: "https://fonteum.com"
repository: "https://github.com/Fonteum/mcp-server"

categories:
  - government
  - data
  - public-records

keywords:
  - public-records
  - sanctions
  - watchlists
  - healthcare
  - federal-procurement
  - federal-enforcement
  - corporate-registers
  - open-data

runtime: "remote"
startCommand:
  type: http
  url: "https://fonteum.com/api/mcp"

tools:
  - name: fonteum_resolve_entity
    description: "Find the available public records for one NPI, UEI, or CAGE identifier, including source context for returned records."
  - name: fonteum_search_records
    description: "Find matching healthcare-provider records for a provider type and state from the available healthcare search data."
  - name: fonteum_check_exclusions_and_sanctions
    description: "Show supported exclusion, debarment, or sanctions-list entries for an NPI or name, with the issuing authority and available source timing."
  - name: fonteum_get_record_as_of
    description: "Show available federal-contractor records for a supplied UEI or CAGE and past date; historical coverage depends on the source."
  - name: fonteum_recheck
    description: "Provide a link and metadata to inspect Fonteum's current stored verification record or a specified snapshot."
  - name: fonteum_list_sources
    description: "List Fonteum's current public source catalog, including official publishers, source links, update notes, and reuse information when available."
  - name: fonteum_dataset_info
    description: "Explain Fonteum's current method, coverage notes, how to read source details, and the generated source catalog."
