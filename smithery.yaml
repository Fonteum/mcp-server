# Smithery manifest for the hosted Fonteum MCP server.
# The service is a remote Streamable HTTP server; Smithery connects to the
# existing endpoint and does not build or deploy this repository.

name: "fonteum/mcp-server"
displayName: "Fonteum — Public Records & Sanctions"
version: "0.3.0"
description: >-
  Hosted, read-only MCP server for Fonteum's source-linked public-records data
  graph. It covers US healthcare, federal procurement, sanctions and
  watchlists, federal enforcement, and global open-data corporate registers.
  111 active source families in the provenance ledger as of 2026-07-12.
  Results identify their source, capture date, and applicable limitations.
  Medical review: Dr. Jennifer Montecillo, MD.
author:
  name: "Fonteum LLC"
  email: "hello@fonteum.com"
  url: "https://fonteum.com"
license: MIT
homepage: "https://fonteum.com"
repository: "https://github.com/Fonteum/mcp-server"

categories:
  - government
  - data
  - public-records

keywords:
  - public-records
  - sanctions
  - watchlists
  - healthcare
  - federal-procurement
  - federal-enforcement
  - corporate-registers
  - open-data

runtime: "remote"
startCommand:
  type: http
  url: "https://fonteum.com/api/mcp"

tools:
  - name: fonteum_resolve_entity
    description: "Resolve an entity by NPI, UEI, or CAGE and return available healthcare or federal-procurement records with their source context."
  - name: fonteum_search_records
    description: "Search US healthcare records by vertical and state, with optional county context."
  - name: fonteum_check_exclusions_and_sanctions
    description: "Check an NPI or name against applicable US exclusion, debarment, and sanctions lists; re-confirm material matches with the issuing authority."
  - name: fonteum_get_record_as_of
    description: "Return a federal contractor record as captured on a supplied date, using a UEI or CAGE identifier."
  - name: fonteum_recheck
    description: "Return source and capture information to support a follow-up check of a Fonteum record."
  - name: fonteum_list_sources
    description: "List Fonteum's public multi-vertical source catalog and separately report the dated active-ledger count, with authority, coverage, refresh information, and official source URLs."
  - name: fonteum_dataset_info
    description: "Return published methodology, scope, and source-catalog metadata for the current MCP service."
